<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>身體組成紀錄</title>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

/* 輸入區 */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 16px;
    cursor: pointer;
}

.save-btn {
    width: 100%;
    margin-top: 20px;
    background: #4a90e2;
    color: white;
}

.save-btn:hover {
    background: #357abd;
}

.delete-btn {
    background: #e74c3c;
    color: white;
    padding: 6px 10px;
    font-size: 14px;
}

.delete-btn:hover {
    background: #c0392b;
}

.edit-btn {
    background: #f0ad4e;
    color: white;
    padding: 6px 10px;
    font-size: 14px;
    margin-right: 6px;
}

.edit-btn:hover {
    background: #d99524;
}

.cancel-btn {
    width: 100%;
    margin-top: 10px;
    background: #6c757d;
    color: white;
}

.cancel-btn:hover {
    background: #565e64;
}

/* BMI */

.bmi-result {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

/* Dashboard */

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    background: #f7f8fa;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}

.stat-title {
    font-size: 14px;
    color: #777;
}

.stat-value {
    font-size: 23px;
    font-weight: bold;
    margin-top: 8px;
}

/* 表格 */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #f1f3f5;
}

.empty {
    text-align: center;
    color: #888;
    padding: 20px;
}

/* 手機 */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 18px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>

</head>


<body>

<div class="container">

<h1>📊 身體組成紀錄</h1>


<!-- 新增紀錄 -->

<div class="card">

<h2>➕ 新增測量紀錄</h2>

<div class="form-grid">

<div>

<label>日期</label>

<input
type="date"
id="date"
>

</div>


<div>

<label>身高（cm）</label>

<input
type="number"
id="height"
step="0.1"
placeholder="例如 162"
>

</div>


<div>

<label>體重（kg）</label>

<input
type="number"
id="weight"
step="0.1"
placeholder="例如 81.2"
>

</div>


<div>

<label>體脂率（%）</label>

<input
type="number"
id="bodyFat"
step="0.1"
placeholder="例如 28.2"
>

</div>


<div>

<label>骨骼肌（kg）</label>

<input
type="number"
id="muscle"
step="0.1"
placeholder="例如 28.9"
>

</div>


<div>

<label>基礎代謝（kcal）</label>

<input
type="number"
id="bmr"
placeholder="例如 1530"
>

</div>


<div>

<label>身體年齡</label>

<input
type="number"
id="bodyAge"
placeholder="例如 41"
>

</div>


<div>

<label>內臟脂肪</label>

<input
type="number"
id="visceralFat"
step="0.1"
placeholder="例如 11"
>

</div>

</div>


<div
class="bmi-result"
id="bmiResult"
>
BMI：尚未計算
</div>


<button
class="save-btn"
id="saveButton"
onclick="saveRecord()"
>
💾 儲存紀錄
</button>

<button
class="cancel-btn"
id="cancelEditButton"
onclick="cancelEdit()"
style="display:none;"
>
取消編輯
</button>

</div>



<!-- 最近一次資料 -->

<div class="card">

<h2>📌 最近一次測量</h2>

<div class="dashboard">

<div class="stat">

<div class="stat-title">
體重
</div>

<div
class="stat-value"
id="showWeight"
>
--
</div>

</div>


<div class="stat">

<div class="stat-title">
體脂率
</div>

<div
class="stat-value"
id="showBodyFat"
>
--
</div>

</div>


<div class="stat">

<div class="stat-title">
BMI
</div>

<div
class="stat-value"
id="showBMI"
>
--
</div>

</div>


<div class="stat">

<div class="stat-title">
骨骼肌
</div>

<div
class="stat-value"
id="showMuscle"
>
--
</div>

</div>


<div class="stat">

<div class="stat-title">
基礎代謝
</div>

<div
class="stat-value"
id="showBMR"
>
--
</div>

</div>


<div class="stat">

<div class="stat-title">
身體年齡
</div>

<div
class="stat-value"
id="showBodyAge"
>
--
</div>

</div>


<div class="stat">

<div class="stat-title">
內臟脂肪
</div>

<div
class="stat-value"
id="showVisceralFat"
>
--
</div>

</div>

</div>

</div>


<!-- 趨勢圖 -->

<div class="card">

<h2>📈 身體組成趨勢</h2>

<select id="chartType" onchange="updateChart()">

<option value="weight">體重（kg）</option>

<option value="bodyFat">體脂率（%）</option>

<option value="bmi">BMI</option>

<option value="muscle">骨骼肌（kg）</option>

<option value="bmr">基礎代謝（kcal）</option>

<option value="bodyAge">身體年齡</option>

<option value="visceralFat">內臟脂肪</option>

</select>

<div style="height:350px; margin-top:20px;">

<canvas id="bodyChart"></canvas>

</div>

</div>

<!-- 歷史紀錄 -->


<div class="card">

<h2>📋 歷史紀錄</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>日期</th>

<th>體重</th>

<th>體脂率</th>

<th>BMI</th>

<th>骨骼肌</th>

<th>基礎代謝</th>

<th>身體年齡</th>

<th>內臟脂肪</th>

<th>操作</th>

</tr>

</thead>

<tbody
id="recordTable"
>

</tbody>

</table>

</div>

<div
class="empty"
id="emptyMessage"
>
目前還沒有紀錄
</div>

</div>


</div>



<script>

let bodyChart = null;
    
/* =========================
   初始化
========================= */

let records =
JSON.parse(
    localStorage.getItem("bodyRecords")
) || [];

let editingId = null;


/* =========================
   今天日期
========================= */

function setToday() {

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    document.getElementById("date").value =
        `${year}-${month}-${day}`;
}


/* =========================
   計算 BMI
========================= */

function calculateBMI(
    height,
    weight
) {

    if (
        !height ||
        !weight
    ) {
        return null;
    }

    const heightM =
        height / 100;

    return weight /
        (heightM * heightM);
}


/* =========================
   儲存紀錄
========================= */

function saveRecord() {

    const date =
        document.getElementById(
            "date"
        ).value;

    const height =
        Number(
            document.getElementById(
                "height"
            ).value
        );

    const weight =
        Number(
            document.getElementById(
                "weight"
            ).value
        );

    const bodyFat =
        Number(
            document.getElementById(
                "bodyFat"
            ).value
        );

    const muscle =
        Number(
            document.getElementById(
                "muscle"
            ).value
        );

    const bmr =
        Number(
            document.getElementById(
                "bmr"
            ).value
        );

    const bodyAge =
        Number(
            document.getElementById(
                "bodyAge"
            ).value
        );

    const visceralFat =
        Number(
            document.getElementById(
                "visceralFat"
            ).value
        );


    /* 檢查必要資料 */

    if (
        !date ||
        !height ||
        !weight
    ) {

        alert(
            "請至少輸入日期、身高及體重"
        );

        return;
    }


    const bmi =
        calculateBMI(
            height,
            weight
        );


const record = {

    id: editingId ?? Date.now(),

    date: date,

    height: height,

    weight: weight,

    bodyFat:
        document.getElementById("bodyFat").value !== ""
        ? bodyFat
        : null,

    bmi: bmi,

    muscle:
        document.getElementById("muscle").value !== ""
        ? muscle
        : null,

    bmr:
        document.getElementById("bmr").value !== ""
        ? bmr
        : null,

    bodyAge:
        document.getElementById("bodyAge").value !== ""
        ? bodyAge
        : null,

    visceralFat:
        document.getElementById("visceralFat").value !== ""
        ? visceralFat
        : null

};


    if (editingId === null) {
        records.push(record);
    } else {
        records = records.map(item =>
            item.id === editingId ? record : item
        );
    }


    /* 儲存到瀏覽器 */

    localStorage.setItem(
        "bodyRecords",
        JSON.stringify(records)
    );


    alert(
        editingId === null
        ? "✅ 紀錄已儲存！"
        : "✅ 紀錄已更新！"
    );


    /* 更新畫面 */

    displayRecords();

    displayLatest(record);
    
    updateChart();

    /* 清空輸入 / 結束編輯 */

    resetForm();

}


/* =========================
   顯示最近一次資料
========================= */

function displayLatest(
    record
) {

    document.getElementById(
        "showWeight"
    ).innerText =
        record.weight.toFixed(1)
        + " kg";


    document.getElementById(
        "showBodyFat"
    ).innerText =
        record.bodyFat !== null
        ? record.bodyFat.toFixed(1)
          + " %"
        : "--";


    document.getElementById(
        "showBMI"
    ).innerText =
        record.bmi.toFixed(1);


    document.getElementById(
        "showMuscle"
    ).innerText =
        record.muscle !== null
        ? record.muscle.toFixed(1)
          + " kg"
        : "--";


    document.getElementById(
        "showBMR"
    ).innerText =
        record.bmr !== null
        ? record.bmr
          + " kcal"
        : "--";


    document.getElementById(
        "showBodyAge"
    ).innerText =
        record.bodyAge !== null
        ? record.bodyAge
        : "--";


    document.getElementById(
        "showVisceralFat"
    ).innerText =
        record.visceralFat !== null
        ? record.visceralFat
        : "--";

}


/* =========================
   顯示歷史紀錄
========================= */

function displayRecords() {

    const table =
        document.getElementById(
            "recordTable"
        );

    const emptyMessage =
        document.getElementById(
            "emptyMessage"
        );


    table.innerHTML = "";


    if (
        records.length === 0
    ) {

        emptyMessage.style.display =
            "block";

        return;

    }


    emptyMessage.style.display =
        "none";


    /* 最新日期排前面 */

    const sortedRecords =
        [...records].sort(
            (a, b) =>
                new Date(b.date)
                -
                new Date(a.date)
        );


    sortedRecords.forEach(
        record => {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${record.date}
                </td>

                <td>
                    ${record.weight.toFixed(1)}
                </td>

                <td>
                    ${
                        record.bodyFat !== null
                        ? record.bodyFat.toFixed(1) + "%"
                        : "--"
                    }
                </td>

                <td>
                    ${record.bmi.toFixed(1)}
                </td>

                <td>
                    ${
                        record.muscle !== null
                        ? record.muscle.toFixed(1)
                        : "--"
                    }
                </td>

                <td>
                    ${
                        record.bmr !== null
                        ? record.bmr
                        : "--"
                    }
                </td>

                <td>
                    ${
                        record.bodyAge !== null
                        ? record.bodyAge
                        : "--"
                    }
                </td>

                <td>
                    ${
                        record.visceralFat !== null
                        ? record.visceralFat
                        : "--"
                    }
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editRecord(${record.id})"
                    >
                        編輯
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteRecord(${record.id})"
                    >
                        刪除
                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =========================
   編輯紀錄
========================= */

function editRecord(id) {

    const record = records.find(item => item.id === id);

    if (!record) {
        return;
    }

    editingId = id;

    document.getElementById("date").value = record.date;
    document.getElementById("height").value = record.height ?? "";
    document.getElementById("weight").value = record.weight ?? "";
    document.getElementById("bodyFat").value = record.bodyFat ?? "";
    document.getElementById("muscle").value = record.muscle ?? "";
    document.getElementById("bmr").value = record.bmr ?? "";
    document.getElementById("bodyAge").value = record.bodyAge ?? "";
    document.getElementById("visceralFat").value = record.visceralFat ?? "";

    document.getElementById("bmiResult").innerText =
        `BMI：${Number(record.bmi).toFixed(1)}`;

    document.getElementById("saveButton").innerText = "💾 更新紀錄";
    document.getElementById("cancelEditButton").style.display = "block";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEdit() {
    resetForm();
}

function resetForm() {

    editingId = null;

    document.getElementById("weight").value = "";
    document.getElementById("bodyFat").value = "";
    document.getElementById("muscle").value = "";
    document.getElementById("bmr").value = "";
    document.getElementById("bodyAge").value = "";
    document.getElementById("visceralFat").value = "";

    document.getElementById("bmiResult").innerText = "BMI：尚未計算";
    document.getElementById("saveButton").innerText = "💾 儲存紀錄";
    document.getElementById("cancelEditButton").style.display = "none";

    setToday();
}


/* =========================
   刪除紀錄
========================= */

function deleteRecord(
    id
) {

    const confirmDelete =
        confirm(
            "確定要刪除這筆紀錄嗎？"
        );


    if (
        !confirmDelete
    ) {
        return;
    }


    records =
        records.filter(
            record =>
                record.id !== id
        );


    localStorage.setItem(
        "bodyRecords",
        JSON.stringify(records)
    );


    displayRecords();
    updateChart();


    if (
        records.length > 0
    ) {

        const sortedRecords =
            [...records].sort(
                (a, b) =>
                    new Date(b.date)
                    -
                    new Date(a.date)
            );

        displayLatest(
            sortedRecords[0]
        );

    } else {

        clearLatest();

    }

}


/* =========================
   清除最近資料
========================= */

function clearLatest() {

    document.getElementById(
        "showWeight"
    ).innerText = "--";

    document.getElementById(
        "showBodyFat"
    ).innerText = "--";

    document.getElementById(
        "showBMI"
    ).innerText = "--";

    document.getElementById(
        "showMuscle"
    ).innerText = "--";

    document.getElementById(
        "showBMR"
    ).innerText = "--";

    document.getElementById(
        "showBodyAge"
    ).innerText = "--";

    document.getElementById(
        "showVisceralFat"
    ).innerText = "--";

}


/* =========================
   網頁載入
========================= */

setToday();

displayRecords();

updateChart();


if (
    records.length > 0
) {

    const sortedRecords =
        [...records].sort(
            (a, b) =>
                new Date(b.date)
                -
                new Date(a.date)
        );

    displayLatest(
        sortedRecords[0]
    );

}


/* =========================
   趨勢圖
========================= */

function updateChart() {

    const chartType = document.getElementById("chartType").value;

    const sortedRecords = [...records].sort(
        (a, b) => new Date(a.date) - new Date(b.date)
    );

    const labels = sortedRecords.map(record => record.date);

    const data = sortedRecords.map(record => {

        const rawValue = record[chartType];

        if (
            rawValue === null ||
            rawValue === undefined ||
            rawValue === ""
        ) {
            return null;
        }

        const value = Number(rawValue);

        return Number.isFinite(value) ? value : null;

    });

    const chartLabels = {

        weight: "體重（kg）",

        bodyFat: "體脂率（%）",

        bmi: "BMI",

        muscle: "骨骼肌（kg）",

        bmr: "基礎代謝（kcal）",

        bodyAge: "身體年齡",

        visceralFat: "內臟脂肪"

    };

    const canvas = document.getElementById("bodyChart");

    if (!canvas) {
        console.error("找不到 bodyChart");
        return;
    }

    if (bodyChart) {
        bodyChart.destroy();
        bodyChart = null;
    }

    if (sortedRecords.length === 0) {
        return;
    }

    /*
     * 如果選擇的項目全部沒有數值，
     * 就不建立空圖表
     */

    const hasData = data.some(
        value => value !== null
    );

    if (!hasData) {

        console.warn(
            "目前選擇的項目沒有有效資料：",
            chartType
        );

        return;
    }

    bodyChart = new Chart(
        canvas,
        {

            type: "line",

            data: {

                labels: labels,

                datasets: [

                    {

                        label: chartLabels[chartType],

                        data: data,

                        borderWidth: 3,

                        pointRadius: 6,

                        pointHoverRadius: 8,

                        tension: 0.25,

                        fill: false

                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    x: {

                        display: true,

                        grid: {

                            display: true

                        }

                    },

                    y: {

                        display: true,

                        beginAtZero: false,

                        grid: {

                            display: true

                        }

                    }

                },

                plugins: {

                    legend: {

                        display: true

                    }

                }

            }

        }
    );

}

</script>

</body>

</html>
